<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="AceisOriginal cloud logo">
  <defs>
    <linearGradient id="cloudFill" x1="40" y1="40" x2="200" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F6FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7CC7F4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- soft under puff -->
  <ellipse cx="120" cy="118" rx="86" ry="24" fill="#D5F1FE" opacity="0.55"/>
  <!-- fluffy cloud body (no face/eyes) -->
  <g filter="url(#soft)">
    <ellipse cx="62" cy="96" rx="46" ry="34" fill="url(#cloudFill)" stroke="#7CC7F4" stroke-width="3"/>
    <ellipse cx="112" cy="78" rx="58" ry="42" fill="url(#cloudFill)" stroke="#7CC7F4" stroke-width="3"/>
    <ellipse cx="164" cy="90" rx="44" ry="36" fill="url(#cloudFill)" stroke="#7CC7F4" stroke-width="3"/>
    <ellipse cx="190" cy="104" rx="34" ry="26" fill="url(#cloudFill)" stroke="#7CC7F4" stroke-width="3"/>
    <ellipse cx="44" cy="110" rx="30" ry="22" fill="url(#cloudFill)" stroke="#7CC7F4" stroke-width="3"/>
    <ellipse cx="120" cy="116" rx="78" ry="30" fill="url(#cloudFill)" stroke="#7CC7F4" stroke-width="3"/>
    <ellipse cx="132" cy="104" rx="20" ry="16" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <!-- cute gold stars -->
  <path d="M48 42 L51.2 51.2 L61 52 L53.5 58.2 L56 68 L48 62.5 L40 68 L42.5 58.2 L35 52 L44.8 51.2 Z" fill="#E8B84A" stroke="#C9922E" stroke-width="1.2"/>
  <path d="M188 36 L190.4 43.2 L198 44 L192.2 48.6 L194 56 L188 51.8 L182 56 L183.8 48.6 L178 44 L185.6 43.2 Z" fill="#F0C75E" stroke="#C9922E" stroke-width="1"/>
  <path d="M168 58 L169.6 62.8 L174.5 63.2 L170.8 66.2 L172 71 L168 68.2 L164 71 L165.2 66.2 L161.5 63.2 L166.4 62.8 Z" fill="#FFE08A" stroke="#C9922E" stroke-width="0.9"/>
  <!-- tiny blush sparkle accent (not eyes) -->
  <circle cx="96" cy="100" r="3" fill="#F7ADCF" opacity="0.55"/>
  <circle cx="148" cy="98" r="2.5" fill="#F7ADCF" opacity="0.45"/>
</svg>
